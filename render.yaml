services:
  # Main app: Express API + serves the React frontend build.
  - type: web
    name: mission-control-web
    env: node
    plan: starter
    buildCommand: npm --prefix server install && npm --prefix client install && npm --prefix client run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mission-control-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Optional: set these later to enable email notifications.
      # - key: RESEND_API_KEY
      #   sync: false
      # - key: EMAIL_FROM
      #   value: Mission Control <noreply@example.org>

  # Daily reminder check: finds due reminders, creates notifications,
  # and (when email is configured) emails admins. Runs against the same DB.
  - type: cron
    name: mission-control-reminders
    env: node
    plan: starter
    schedule: "0 9 * * *"
    buildCommand: npm --prefix server install
    startCommand: node server/cron.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mission-control-db
          property: connectionString
      # - key: RESEND_API_KEY
      #   sync: false

databases:
  - name: mission-control-db
    plan: starter
    databaseName: missioncontrol
    user: missioncontrol
